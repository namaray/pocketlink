[workspace]
resolver = "3"
members = ["crates/pocketlink-core", "crates/pocketlink"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/namaray/pocketlink"

[workspace.dependencies]
futures = "0.3"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
url = "2.5"
zbus = { version = "5.15", default-features = false, features = ["tokio"] }

# libcosmic is painfully slow unoptimised; keep our own code quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
