[package]
name = "pocketlink-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The KDE Connect protocol: discovery, TLS links, pairing and payloads"

[dependencies]
base64 = "0.23.1"
hex = "0.4.3"
if-addrs = "0.15.0"
rcgen = { version = "0.14.10", features = ["pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
uuid = { version = "1.29.0", features = ["v4"] }
x509-parser = "0.18.1"

[dev-dependencies]
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
